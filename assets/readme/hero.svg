<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#ffffff"/>

  <!-- Accent bar on left -->
  <rect width="4" height="400" fill="#eb3d4b"/>

  <!-- Title -->
  <text x="20" y="100" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="#2c3e50">
    ITIL Service Desk
  </text>

  <!-- Subtitle -->
  <text x="20" y="150" font-family="system-ui, sans-serif" font-size="24" font-weight="400" fill="#34495e">
    Banking-Grade IT Service Management
  </text>

  <!-- Visual motif: ticket/sticky note representation -->
  <g transform="translate(900, 80)">
    <!-- Main ticket -->
    <rect x="0" y="0" width="200" height="100" rx="8" fill="#f8f9fa" stroke="#ecf0f1" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="100" fill="#eb3d4b"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2c3e50">
      INC-001234
    </text>
    <text x="20" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#7f8c8d">
      Critical - Password Reset
    </text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#95a5a6">
      Assigned: Agent Adu • 2h 15m remaining
    </text>

    <!-- Secondary tickets showing process -->
    <rect x="220" y="20" width="180" height="80" rx="6" fill="#f8f9fa" stroke="#ecf0f1" stroke-width="1"/>
    <rect x="220" y="20" width="4" height="80" fill="#e16fb5"/>
    <text x="240" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2c3e50">
      INC-001235
    </text>
    <text x="240" y="60" font-family="system-ui, sans-serif" font-size="10" fill="#7f8c8d">
      High - Email Issue
    </text>

    <rect x="410" y="40" width="160" height="60" rx="4" fill="#f8f9fa" stroke="#ecf0f1" stroke-width="1"/>
    <rect x="410" y="40" width="4" height="60" fill="#fa7b45"/>
    <text x="430" y="60" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#2c3e50">
      INC-001236
    </text>
    <text x="430" y="75" font-family="system-ui, sans-serif" font-size="9" fill="#7f8c8d">
      Medium - Software Request
    </text>
  </g>

  <!-- Technical stack badges -->
  <g transform="translate(20, 220)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#2c3e50">
      Tech Stack:
    </text>
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="0.5"/>
      <text x="10" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#2c3e50">React</text>
    </g>
    <g transform="translate(90, 0)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="0.5"/>
      <text x="10" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#2c3e50">Node.js</text>
    </g>
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="0.5"/>
      <text x="10" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#2c3e50">MongoDB</text>
    </g>
    <g transform="translate(270, 0)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="0.5"/>
      <text x="10" y="16" font-family="system-ui, sans-serif" font-size="10" fill="#2c3e50">Redux</text>
    </g>
  </g>

  <!-- ITIL process indicators -->
  <g transform="translate(800, 220)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#2c3e50">
      ITIL Processes:
    </text>
    <g transform="translate(0, 24)">
      <circle cx="0" cy="12" r="10" fill="#eb3d4b" opacity="0.9"/>
      <text x="20" y="16" font-family="system-ui, sans-serif" font-size="12" fill="#2c3e50">Incident</text>
    </g>
    <g transform="translate(80, 0)">
      <circle cx="0" cy="12" r="10" fill="#e16fb5" opacity="0.9"/>
      <text x="20" y="16" font-family="system-ui, sans-serif" font-size="12" fill="#2c3e50">Problem</text>
    </g>
    <g transform="translate(160, 0)">
      <circle cx="0" cy="12" r="10" fill="#fa7b45" opacity="0.9"/>
      <text x="20" y="16" font-family="system-ui, sans-serif" font-size="12" fill="#2c3e50">Change</text>
    </g>
    <g transform="translate(240, 0)">
      <circle cx="0" cy="12" r="10" fill="#2ecc71" opacity="0.9"/>
      <text x="20" y="16" font-family="system-ui, sans-serif" font-size="12" fill="#2c3e50">Request</text>
    </g>
  </g>
</svg>